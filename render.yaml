databases:
  - name: informed-opinion-db
    databaseName: informed_opinion_production
    user: informed_opinion
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: informed-opinion
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /up
    preDeployCommand: ./bin/rails db:prepare
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: informed-opinion-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_HOST
        value: informedopinion.info
      - key: APP_PROTOCOL
        value: https
      - key: ALTERNATE_APP_HOST
        value: whatdoyouthink.info
      - key: ALTERNATE_SITE_ENABLED
        value: "false"
      - key: MAILER_FROM
        value: Informed Opinion <accounts@informedopinion.info>
      - key: MAILER_REPLY_TO
        value: hello@informedopinion.info
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: SKIP_DB_PREPARE
        value: "true"
