databases:
  - name: informed-opinion-db
    databaseName: informed_opinion_production
    user: informed_opinion
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: informed-opinion
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /up
    preDeployCommand: ./bin/rails db:prepare
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: informed-opinion-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: SKIP_DB_PREPARE
        value: "true"
